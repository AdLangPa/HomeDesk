<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HomeDesk">
<meta name="theme-color" content="#243f56">
<title>HomeDesk — Real Estate CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf8f4;--surf:#ffffff;--surf2:#f4f0e8;--surf3:#ece3d0;
  --bord:#e3dccb;--bord2:#cfc3a6;
  --txt:#243f56;--txt2:#5c7086;--txt3:#8b98a4;
  --acc:#243f56;--acc-soft:#e8edf1;
  --green:#397044;--green-soft:#e7f0e6;
  --amber:#a8721c;--amber-soft:#faf1de;
  --red:#c81e3a;--red-soft:#fbe8ea;
  --blue:#2f6690;--blue-soft:#e7eef3;
  --brand-amber:#f5b544;
  --rad:8px;--rad-lg:12px;
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --display:'Plus Jakarta Sans',-apple-system,sans-serif;
}
[data-theme="dark"]{
  --bg:#151f29;--surf:#1b2733;--surf2:#22303d;--surf3:#2b3c4a;
  --bord:#334759;--bord2:#425b70;
  --txt:#f4f0e8;--txt2:#aebccb;--txt3:#7c8fa1;
  --acc:#f5b544;--acc-soft:#3a2f18;
  --green:#7fbb7f;--green-soft:#1e2e20;
  --amber:#f5b544;--amber-soft:#3a2f18;
  --red:#e37f8e;--red-soft:#3a1e24;
  --blue:#7db3d6;--blue-soft:#1c2f3a;
  --brand-amber:#f5b544;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:var(--blue);text-decoration:none}

/* Layout */
.layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:208px;min-width:208px;background:var(--surf2);border-right:1px solid var(--bord);display:flex;flex-direction:column;padding:16px 0;overflow-y:auto}
.logo{padding:0 18px 16px;border-bottom:1px solid var(--bord);margin-bottom:8px}
.logo-title{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:7px}
.logo-sub{font-size:11px;color:var(--txt3);margin-top:2px}
.nav-section{font-size:10px;font-weight:600;color:var(--txt3);padding:14px 18px 4px;letter-spacing:.7px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 18px;cursor:pointer;font-size:13px;color:var(--txt2);border-left:2px solid transparent;transition:background .12s,color .12s}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 6px;min-width:16px;text-align:center}
.nav-item:hover{background:var(--surf3);color:var(--txt)}
.nav-item.active{background:var(--surf3);color:var(--txt);border-left-color:var(--acc);font-weight:500}
.nav-ico{width:17px;text-align:center;flex-shrink:0;font-size:15px}
.sync-status{margin-top:auto;padding:10px 18px 0;border-top:1px solid var(--bord);font-size:11px;color:var(--txt3);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--txt3);flex-shrink:0}
.dot.ok{background:var(--green)}.dot.off{background:var(--bord2)}

.main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.topbar{padding:15px 22px;border-bottom:1px solid var(--bord);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--surf)}
.topbar-title{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:-.1px}
.topbar-actions{display:flex;gap:8px}
.content{flex:1;overflow-y:auto;padding:22px;background:var(--bg)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--rad);border:1px solid var(--bord2);background:var(--surf);color:var(--txt);font-size:13px;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surf2)}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.primary:hover{background:#a83c33}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surf2)}
.btn.danger{color:var(--red);border-color:var(--bord2)}
.btn.danger:hover{background:var(--red-soft);border-color:var(--red)}

/* Cards */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rad-lg);padding:16px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.card:hover{border-color:var(--bord2);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
.card-title{font-size:14px;font-weight:600;line-height:1.3}
.card-sub{font-size:12px;color:var(--txt2)}
.card-meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px;padding-top:11px;border-top:1px solid var(--bord)}
.meta label{font-size:10px;color:var(--txt3);display:block;text-transform:uppercase;letter-spacing:.4px;margin-bottom:1px}
.meta span{font-size:12px;font-weight:500}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:500;white-space:nowrap}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.gray{background:var(--surf3);color:var(--txt2)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rad);padding:14px}
.stat-val{font-size:23px;font-weight:600;line-height:1;letter-spacing:-.5px}
.stat-lbl{font-size:11px;color:var(--txt3);margin-top:5px;text-transform:uppercase;letter-spacing:.4px}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--surf);border:1px solid var(--bord);border-radius:var(--rad-lg);overflow:hidden}
.tbl th{text-align:left;font-size:10px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;padding:9px 12px;border-bottom:1px solid var(--bord);background:var(--surf2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--bord)}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer;transition:background .1s}
.tbl tbody tr:hover{background:var(--surf2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}

/* Section headers */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.sec-title{font-size:12px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.6px}

/* Empty states */
.empty{text-align:center;padding:56px 20px;color:var(--txt3)}
.empty-ico{font-size:34px;margin-bottom:10px;opacity:.5}
.empty p{font-size:13px}

/* Detail pages */
.detail-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--txt2);cursor:pointer;padding:5px 8px;border-radius:var(--rad);transition:background .12s}
.back:hover{background:var(--surf2);color:var(--txt)}
.detail-title{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.2px;flex:1}
.sec{margin-bottom:24px}
.sec-label{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.6px;padding-bottom:8px;border-bottom:1px solid var(--bord);margin-bottom:13px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.info label{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.4px;display:block}
.info span{font-size:13px;display:block;margin-top:2px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bord);margin-bottom:18px}
.tab{padding:9px 15px;font-size:13px;color:var(--txt2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s}
.tab:hover{color:var(--txt)}
.tab.active{color:var(--acc);border-bottom-color:var(--acc);font-weight:500}

/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-grid-head{margin-bottom:6px}
.cal-dow{font-size:11px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.4px;text-align:center;padding:4px 0}
.cal-cell{min-height:88px;border:1px solid var(--bord);border-radius:var(--rad);padding:6px;cursor:pointer;background:var(--surf);transition:border-color .12s,background .12s;position:relative;overflow:hidden}
.cal-cell:hover{border-color:var(--acc);background:var(--surf2)}
.cal-cell.cal-empty{visibility:hidden;cursor:default;border:none}
.cal-cell.cal-today{border-color:var(--acc);border-width:2px;background:var(--acc-soft)}
.cal-daynum{font-size:12px;font-weight:600;color:var(--txt2);margin-bottom:4px}
.cal-pill{font-size:11px;background:var(--surf3);color:var(--txt);border-radius:4px;padding:2px 5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-more{font-size:10px;color:var(--txt3);padding:1px 5px}
.cal-todo-dot{position:absolute;top:6px;right:7px;font-size:8px;color:var(--amber)}
@media(max-width:760px){ .cal-cell{min-height:56px} .cal-pill{display:none} }

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(20,20,18,.4);display:flex;align-items:flex-start;justify-content:center;z-index:200;padding:40px 20px;overflow-y:auto}
.modal{background:var(--surf);border-radius:var(--rad-lg);width:560px;max-width:100%;box-shadow:0 8px 40px rgba(0,0,0,.18);margin:auto}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--bord);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:16px;font-weight:600}
.modal-x{cursor:pointer;color:var(--txt3);font-size:20px;line-height:1;padding:4px;border-radius:var(--rad)}
.modal-x:hover{background:var(--surf2);color:var(--txt)}
.modal-body{padding:20px 22px;max-height:62vh;overflow-y:auto}
.modal-foot{padding:14px 22px;border-top:1px solid var(--bord);display:flex;justify-content:flex-end;gap:8px}

/* Forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--txt2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--bord2);border-radius:var(--rad);background:var(--surf);color:var(--txt);font-size:13px;transition:border-color .12s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--acc)}
.field textarea{min-height:64px;resize:vertical}
.field .hint{font-size:11px;color:var(--txt3);margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form-section{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.6px;margin:18px 0 12px;padding-top:14px;border-top:1px solid var(--bord)}
.form-section:first-child{margin-top:0;padding-top:0;border-top:none}

/* Misc */
.tag{display:inline-block;background:var(--surf3);border-radius:100px;padding:3px 9px;font-size:11px;color:var(--txt2);margin:0 4px 4px 0}
.divider{height:1px;background:var(--bord);margin:18px 0}
.muted{color:var(--txt3)}
.banner{background:var(--blue-soft);border:1px solid #cfe3f6;border-radius:var(--rad);padding:11px 14px;font-size:12px;color:var(--blue);margin-bottom:16px;display:flex;gap:9px;align-items:flex-start}
.pos{color:var(--green)}.neg{color:var(--red)}
.hidden{display:none!important}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Mobile / phone layout ===== */
.pe-l{display:none;font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.itin-sec{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rad-lg);padding:14px 16px}
.itin-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.itin-row{display:grid;grid-template-columns:120px 170px 1fr 30px;gap:8px;align-items:center}
.itin-row input{padding:7px 9px;border:1px solid var(--bord2);border-radius:var(--rad);background:var(--surf);color:var(--txt);font-size:13px;min-width:0;width:100%}
.itin-row.ro{grid-template-columns:90px auto 1fr;padding:6px 2px;border-bottom:1px solid var(--bord)}
.itin-time{font-weight:600;font-variant-numeric:tabular-nums}
.itin-label{font-weight:500}
.itin-note-ro{color:var(--txt2);font-size:12px}
.itin-chips{display:flex;flex-wrap:wrap;gap:6px}
.itin-add{border-style:dashed}
.itin-mini,.ev-card-itin{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.itin-chip{font-size:11px;font-weight:400;color:var(--txt2);background:var(--surf2);border-radius:100px;padding:2px 8px;white-space:nowrap}
.itin-chip b{color:var(--txt);font-weight:600}
.ev-card-itin{margin-top:8px}
.task-list{display:flex;flex-direction:column}
.task-row{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--bord)}
.task-row input[type=checkbox]{width:17px;height:17px;margin-top:2px;flex-shrink:0;cursor:pointer}
.task-main{flex:1;min-width:0}
.task-title{font-size:13px;font-weight:500}
.task-row.done .task-title{text-decoration:line-through;color:var(--txt3)}
.task-notes{font-size:12px;color:var(--txt2);margin-top:2px;white-space:pre-wrap}
.task-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--txt3);margin-top:3px}
.task-side{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;text-align:right}
.task-due{font-size:11px;color:var(--txt3)}
.task-due.overdue{color:var(--red);font-weight:600}
.task-acts{font-size:11px}.task-acts a{cursor:pointer;color:var(--txt3)}.task-acts a:hover{color:var(--txt)}
.task-done-block{margin-top:10px}.task-done-block summary{cursor:pointer;font-size:12px;color:var(--txt3);padding:4px 0}
.fin-panel{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rad-lg);margin-bottom:10px}
.fin-panel>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px}
.fin-panel>summary::-webkit-details-marker{display:none}
.fin-panel>summary::before{content:'▸';color:var(--txt3);transition:transform .15s;display:inline-block}
.fin-panel[open]>summary::before{transform:rotate(90deg)}
.fin-title{font-weight:600;font-size:14px}
.fin-sub{font-size:12px;color:var(--txt3);margin-left:auto;text-align:right}
.fin-body{padding:0 16px 16px}
.fin-body .stats{margin-bottom:10px}
:root{--fin-c1:#2a78d6;--fin-c2:#eb6834}
[data-theme="dark"]{--fin-c1:#3987e5;--fin-c2:#d95926}
.fin-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--txt2);margin-bottom:10px;align-items:center}
.fin-legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.sw.f,.fin-bar.f{background:var(--fin-c1)}.sw.r,.fin-bar.r{background:var(--fin-c2)}
.fin-chart{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:6px;border-bottom:1px solid var(--bord);overflow-x:auto}
.fin-col{flex:1 0 28px;max-width:56px;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;cursor:default;outline:none}
.fin-stack{width:70%;display:flex;flex-direction:column;gap:2px;justify-content:flex-end}
.fin-bar{width:100%}.fin-stack>.fin-bar:first-child{border-radius:4px 4px 0 0}
.fin-col:hover .fin-bar,.fin-col:focus .fin-bar{filter:brightness(1.15)}
.fin-x{font-size:10px;color:var(--txt3);margin-top:4px;white-space:nowrap;height:16px}
.fin-table-toggle{margin-top:10px}.fin-table-toggle summary{cursor:pointer;font-size:12px;color:var(--txt3)}
.ev-cards{display:none;flex-direction:column;gap:10px}
.ev-card{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rad-lg);padding:13px 14px;cursor:pointer}
.ev-card:active{background:var(--surf2)}
.ev-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ev-card-name{font-size:15px;font-weight:600;line-height:1.3}
.ev-card-sub{font-size:12px;color:var(--txt2);margin-top:3px}
.ev-card-badges{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;flex-shrink:0;max-width:45%}
.ev-card-badges .badge{margin-left:0!important}
.ev-card-note{font-size:13px;color:var(--txt);margin-top:8px;padding:7px 10px;background:var(--surf2);border-radius:var(--rad)}
.ev-card-figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--bord)}
.ev-card-figs label{display:block;font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.4px}
.ev-card-figs span{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.inq-list{display:flex;flex-direction:column;gap:8px}
.inq-row{display:flex;gap:12px;align-items:flex-start;background:var(--surf);border:1px solid var(--bord);border-radius:var(--rad);padding:10px 12px}
.inq-main{flex:1;min-width:0}
.inq-venue{font-weight:600;font-size:13px}.inq-venue a{color:var(--txt);cursor:pointer}
.inq-meta{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;color:var(--txt2);margin-top:2px}.inq-meta a{cursor:pointer}
.inq-note{font-size:12px;color:var(--txt);margin-top:5px;font-style:italic}
.inq-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.inq-status{padding:5px 8px;border-radius:100px;border:1px solid var(--bord2);font-size:12px;font-weight:500;background:var(--surf2);color:var(--txt)}
.inq-status.green{background:var(--green-soft);color:var(--green);border-color:transparent}.inq-status.amber{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.inq-status.blue{background:var(--blue-soft);color:var(--blue);border-color:transparent}.inq-status.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.inq-acts{font-size:11px;color:var(--txt3)}.inq-acts a{cursor:pointer;color:var(--txt2)}
.inq-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.inq-chip{font-size:12px;padding:3px 10px;border-radius:100px;background:var(--surf2);color:var(--txt2)}
.inq-chip.green{background:var(--green-soft);color:var(--green)}.inq-chip.amber{background:var(--amber-soft);color:var(--amber)}.inq-chip.blue{background:var(--blue-soft);color:var(--blue)}.inq-chip.red{background:var(--red-soft);color:var(--red)}
.inq-hist{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:7px 0;border-bottom:1px solid var(--bord);font-size:12px}
.inq-hist-date{color:var(--txt3);min-width:84px}.inq-hist-note{color:var(--txt)}
.modal:has(#bk-body){width:720px}
.bk-filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bk-filters input,.bk-filters select{padding:7px 9px;border:1px solid var(--bord2);border-radius:var(--rad);background:var(--surf);color:var(--txt);font-size:13px;min-width:0}
.bk-filters input{flex:1;min-width:150px}
.bk-filters input[type=checkbox]{flex:0 0 auto;min-width:0;width:16px;height:16px;padding:0}
.cr-statuses{display:flex;flex-wrap:wrap;gap:8px 14px}
.field .cr-statuses label.bk-check{display:flex;align-items:center;gap:6px;margin:0;font-weight:400;font-size:12px;color:var(--txt)}
.field .cr-statuses input[type=checkbox]{width:16px;height:16px;flex:0 0 auto;margin:0;padding:0}

/* ===== HomeDesk additions ===== */
.btn.primary:hover{background:var(--acc);filter:brightness(1.12)}
[data-theme="dark"] .btn.primary{color:#151f29}
.btn:disabled{opacity:.45;cursor:default}
.topbar-search{position:relative}
.topbar-search input{width:230px;padding:6px 10px 6px 28px;border:1px solid var(--bord2);border-radius:100px;background:var(--surf2);color:var(--txt);font-size:12px}
.topbar-search input:focus{outline:none;border-color:var(--acc);background:var(--surf)}
.topbar-search::before{content:'⌕';position:absolute;left:10px;top:50%;transform:translateY(-52%);color:var(--txt3);font-size:14px}
#search-results{position:absolute;top:calc(100% + 6px);left:0;width:340px;max-height:420px;overflow-y:auto;background:var(--surf);border:1px solid var(--bord);border-radius:var(--rad-lg);box-shadow:0 8px 28px rgba(0,0,0,.14);z-index:150;display:none}
.sr-group{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--txt3);padding:8px 12px 3px}
.sr-item{padding:7px 12px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.sr-item:hover,.sr-item.on{background:var(--surf2)}
.sr-item small{color:var(--txt3);font-size:11px;white-space:nowrap}
.me-select{padding:5px 8px;border:1px solid var(--bord2);border-radius:var(--rad);background:var(--surf);color:var(--txt);font-size:12px;max-width:150px}

/* filters bar */
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{padding:8px 10px;border:1px solid var(--bord2);border-radius:var(--rad);background:var(--surf);color:var(--txt);font-size:13px}
.filters input[type=search],.filters input.grow{flex:1;min-width:180px}
.seg{display:inline-flex;border:1px solid var(--bord2);border-radius:var(--rad);overflow:hidden}
.seg button{border:none;background:var(--surf);color:var(--txt2);padding:7px 12px;font-size:12px}
.seg button+button{border-left:1px solid var(--bord2)}
.seg button.on{background:var(--acc);color:#fff}
[data-theme="dark"] .seg button.on{color:#151f29}

/* pipeline kanban */
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;align-items:flex-start;min-height:60vh}
.kcol{flex:0 0 236px;background:var(--surf2);border:1px solid var(--bord);border-radius:var(--rad-lg);display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
.kcol.drop{border-color:var(--acc);background:var(--acc-soft)}
.khead{padding:10px 12px 8px;border-bottom:1px solid var(--bord)}
.khead-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--txt2)}
.khead-sub{font-size:11px;color:var(--txt3);margin-top:2px;font-variant-numeric:tabular-nums}
.kbody{padding:8px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;min-height:60px}
.kcard{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rad);padding:9px 10px;cursor:grab;font-size:12px}
.kcard:hover{border-color:var(--bord2);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.kcard.dragging{opacity:.45}
.kcard-title{font-size:13px;font-weight:600;line-height:1.3}
.kcard-sub{color:var(--txt2);margin-top:2px}
.kcard-foot{display:flex;justify-content:space-between;align-items:center;margin-top:7px;gap:6px}
.kcard-amt{font-weight:600;font-variant-numeric:tabular-nums}
.kind-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.kind-dot.Buy{background:var(--blue)}.kind-dot.Sell{background:var(--amber)}

/* stage stepper */
.stepper{display:flex;gap:3px;margin-bottom:18px;flex-wrap:wrap}
.step{flex:1 1 80px;text-align:center;font-size:11px;padding:7px 4px;background:var(--surf2);color:var(--txt3);cursor:pointer;border-radius:4px;white-space:nowrap;border:1px solid transparent}
.step:hover{border-color:var(--bord2)}
.step.done{background:var(--acc-soft);color:var(--acc)}
.step.cur{background:var(--acc);color:#fff;font-weight:600}
[data-theme="dark"] .step.cur{color:#151f29}
.step.lost{background:var(--red-soft);color:var(--red)}

/* listings */
.lcard{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rad-lg);overflow:hidden;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.lcard:hover{border-color:var(--bord2);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.lphoto{height:150px;background:var(--surf3) center/cover no-repeat;position:relative;display:flex;align-items:center;justify-content:center;color:var(--txt3);font-size:38px}
.lphoto .badge{position:absolute;top:10px;left:10px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lphoto .ldom{position:absolute;top:10px;right:10px;background:rgba(20,30,40,.7);color:#fff;font-size:11px;padding:2px 8px;border-radius:100px}
.lbody{padding:12px 14px}
.lprice{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.3px}
.laddr{font-size:13px;font-weight:500;margin-top:1px}
.lcity{font-size:12px;color:var(--txt3)}
.lspecs{display:flex;gap:12px;font-size:12px;color:var(--txt2);margin-top:8px;padding-top:8px;border-top:1px solid var(--bord)}
.lspecs b{color:var(--txt)}
.detail-photo{width:100%;max-width:520px;height:260px;border-radius:var(--rad-lg);background:var(--surf3) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:56px;color:var(--txt3);margin-bottom:16px}

/* timeline */
.tl{display:flex;flex-direction:column}
.tl-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--bord)}
.tl-ico{width:28px;height:28px;border-radius:50%;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.tl-main{flex:1;min-width:0}
.tl-head{font-size:13px;font-weight:500}
.tl-head small{color:var(--txt3);font-weight:400;margin-left:6px}
.tl-note{font-size:13px;color:var(--txt2);margin-top:2px;white-space:pre-wrap}
.tl-del{color:var(--txt3);cursor:pointer;font-size:12px;align-self:flex-start}
.tl-del:hover{color:var(--red)}

/* quick action row */
.qa{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}

/* list rows */
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surf);border:1px solid var(--bord);border-radius:var(--rad);margin-bottom:6px;cursor:pointer}
.lrow:hover{border-color:var(--bord2)}
.lrow-main{flex:1;min-width:0}
.lrow-title{font-size:13px;font-weight:600}
.lrow-sub{font-size:12px;color:var(--txt2);margin-top:1px}
.lrow-side{display:flex;align-items:center;gap:8px;flex-shrink:0;font-size:12px;color:var(--txt2)}
.lrow .when{font-size:12px;font-weight:600;min-width:62px;color:var(--txt2);font-variant-numeric:tabular-nums}
.lrow .when.overdue{color:var(--red)}
.lrow .when.today{color:var(--green)}

.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.panel{background:var(--surf);border:1px solid var(--bord);border-radius:var(--rad-lg);padding:14px 16px;margin-bottom:18px}
.panel .sec-head{margin-bottom:8px}
.panel .lrow{border:none;border-bottom:1px solid var(--bord);border-radius:0;margin:0;padding:9px 2px;background:transparent}
.panel .lrow:last-child{border-bottom:none}
.panel .lrow:hover{background:var(--surf2)}

.progress{height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
.progress>div{height:100%;background:var(--green);border-radius:4px}
.progress.sm{height:5px}
.stat-sub{font-size:11px;color:var(--txt2);margin-top:6px}

/* key dates */
.kd-list{display:flex;flex-direction:column;gap:0}
.kd{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--bord);font-size:13px}
.kd-lbl{color:var(--txt2)}
.kd-when{font-size:12px;color:var(--txt3)}
.kd-when.soon{color:var(--amber);font-weight:600}.kd-when.past{color:var(--txt3)}.kd-when.overdue{color:var(--red);font-weight:600}

/* stars */
.stars{color:var(--brand-amber);letter-spacing:1px}

/* toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:100px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s;z-index:500;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.2)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* kiosk */
#kiosk{position:fixed;inset:0;background:var(--bg);z-index:400;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.kiosk-box{width:100%;max-width:520px;background:var(--surf);border:1px solid var(--bord);border-radius:16px;padding:34px 30px}
.kiosk-box h1{font-family:var(--display);font-size:28px;letter-spacing:-.4px;line-height:1.15}
.kiosk-box .field input,.kiosk-box .field select{padding:12px 14px;font-size:16px}
.kiosk-exit{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:410}

.boot{display:flex;align-items:center;justify-content:center;height:60vh;color:var(--txt3);font-size:13px;gap:10px}
.spinner{width:16px;height:16px;border:2px solid var(--bord2);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
.onboard{max-width:620px;margin:30px auto;text-align:center}
.onboard h2{font-family:var(--display);font-size:24px;letter-spacing:-.3px;margin-bottom:8px}
.onboard p{color:var(--txt2);font-size:14px;line-height:1.6;margin-bottom:20px}
.chk-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--bord)}
.chk-row input[type=checkbox]{width:16px;height:16px;flex-shrink:0;cursor:pointer}
.tpl-row{display:grid;grid-template-columns:1fr 80px 110px 30px;gap:6px;margin-bottom:6px;align-items:center}
.tpl-row input,.tpl-row select{padding:6px 8px;border:1px solid var(--bord2);border-radius:6px;background:var(--surf);color:var(--txt);font-size:12px;min-width:0;width:100%}
.ph-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.ph-chip{font-size:11px;font-family:ui-monospace,Menlo,monospace;background:var(--surf2);border:1px solid var(--bord);border-radius:4px;padding:1px 6px;cursor:pointer;color:var(--txt2)}
.ph-chip:hover{border-color:var(--acc);color:var(--acc)}
.mail-preview{background:var(--surf2);border:1px solid var(--bord);border-radius:var(--rad);padding:12px 14px;font-size:13px;white-space:pre-wrap;line-height:1.55}
.cal-pill.k-showing{background:var(--blue-soft);color:var(--blue)}
.cal-pill.k-open{background:var(--green-soft);color:var(--green)}
.cal-pill.k-date{background:var(--amber-soft);color:var(--amber)}
.cal-pill.k-close{background:var(--green);color:#fff}
.cal-pill.k-expiry{background:var(--red-soft);color:var(--red)}
.cal-pill.k-task{background:var(--surf3);color:var(--txt2)}
.cal-pill.k-life{background:var(--surf2);color:var(--txt2)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.legend .cal-pill{display:inline-block;margin:0}

@media(max-width:1000px){ .dash-grid{grid-template-columns:1fr;gap:0} .topbar-search input{width:160px} }
@media(max-width:760px){
  .topbar-search{order:6;flex-basis:100%}
  .topbar-search input{width:100%}
  #search-results{width:100%}
  .me-select{max-width:120px}
  .kcol{flex-basis:78vw;max-height:none}

  .kd .kd-when{grid-column:1/-1}
  .tpl-row{grid-template-columns:1fr 64px 30px}
  .tpl-row select{grid-column:1/3}
  .lrow{flex-wrap:wrap}
  .kiosk-box{padding:24px 18px}
}

@media (pointer:coarse),(max-width:760px){ .kcard .kstage{display:block!important;width:100%;margin-top:7px;padding:5px;border:1px solid var(--bord2);border-radius:6px;background:var(--surf2);color:var(--txt);font-size:12px} }

/* ---------- UTILS ---------- */
const $=id=>document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function jsq(s){ return esc(String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")); }
function uid(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function pad2(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayStr(){ return ymd(new Date()); }
function parseD(s){ return new Date(s+'T12:00:00'); }
function addDays(s,n){ if(!s) return ''; const d=parseD(s); if(isNaN(d)) return ''; d.setDate(d.getDate()+(+n||0)); return ymd(d); }
function daysBetween(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }
function fmtDate(s){ if(!s) return ''; const d=parseD(s); if(isNaN(d)) return s; return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function fmtDateShort(s){ if(!s) return ''; const d=parseD(s); if(isNaN(d)) return s; return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function fmtDow(s){ if(!s) return ''; const d=parseD(s); return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); }
function fmtTime(t){ if(!t) return ''; const [h,m]=t.split(':').map(Number); if(isNaN(h)) return t; const ap=h>=12?'pm':'am'; const hh=((h+11)%12)+1; return hh+(m?':'+pad2(m):'')+ap; }
function relDay(s){
  if(!s) return '';
  const n=daysBetween(todayStr(),s);
  if(n===0) return 'Today'; if(n===1) return 'Tomorrow'; if(n===-1) return 'Yesterday';
  if(n<0) return Math.abs(n)+'d ago'; if(n<7) return fmtDow(s).split(',')[0]; return fmtDateShort(s);
}
function money(n){ n=+n||0; return (n<0?'-':'')+'$'+Math.round(Math.abs(n)).toLocaleString(); }
function moneyK(n){ n=+n||0; const a=Math.abs(n); if(a>=1e6) return (n<0?'-':'')+'$'+(a/1e6).toFixed(a>=1e7?1:2).replace(/\.?0+$/,'')+'M'; if(a>=1e4) return (n<0?'-':'')+'$'+Math.round(a/1e3)+'K'; return money(n); }
function num(v){ const n=parseFloat(String(v==null?'':v).replace(/[$,\s]/g,'')); return isNaN(n)?0:n; }
function fv(id){ const e=$(id); return e?String(e.value).trim():''; }
function fvn(id){ return num(fv(id)); }
function fchk(id){ const e=$(id); return !!(e&&e.checked); }
function timeAgo(ts){
  const s=Math.floor((Date.now()-new Date(ts).getTime())/1000);
  if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago'; if(s<86400*30) return Math.floor(s/86400)+'d ago';
  return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function get(kind,id){ return (DB[kind]||[]).find(x=>x.id===id); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function opts(arr,cur,blank){ return (blank!=null?'<option value="">'+esc(blank)+'</option>':'')+arr.map(o=>{ const v=Array.isArray(o)?o[0]:o, l=Array.isArray(o)?o[1]:o; return '<option value="'+esc(v)+'"'+(String(cur)===String(v)?' selected':'')+'>'+esc(l)+'</option>'; }).join(''); }
function badge(t,c){ return '<span class="badge '+(c||'gray')+'">'+esc(t)+'</span>'; }
function emptyState(ico,msg,btn){ return '<div class="empty"><div class="empty-ico">'+ico+'</div><p>'+msg+'</p>'+(btn?'<div style="margin-top:14px">'+btn+'</div>':'')+'</div>'; }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(window._toastT); window._toastT=setTimeout(()=>t.classList.remove('on'),2600); }
async function copyText(txt,label){
  try{ await navigator.clipboard.writeText(txt); toast((label||'Copied')+' ✓'); }
  catch(e){ openModal('Copy',`<p class="muted" style="font-size:12px;margin-bottom:8px">Your browser blocked the clipboard — select the text and copy it.</p><div class="field"><textarea style="min-height:220px" onfocus="this.select()">${esc(txt)}</textarea></div>`,'<button class="btn" onclick="closeModal()">Close</button>'); }
}

/* ---------- PERSISTENCE ----------
   Two backends behind one API (saveRec / delRec / saveSettingsDoc / logActivity):
   • cloud — the artifact's shared document store: one doc per record, so two
     people editing different records never overwrite each other, live updates
     from other devices arrive through snapshots.
   • local — the whole DB in this browser's localStorage. */
const LS_DB='homedesk_db';
let MODE='boot';        // 'boot' | 'cloud' | 'local'
let CLOUD=null;
let _cloudReady={};
const _writeChain={};
function queueWrite(path,fn){
  const prev=_writeChain[path]||Promise.resolve();
  const next=prev.catch(()=>{}).then(fn).catch(err=>{
    console.error('Write failed',path,err);
    if(err&&err.code==='quota_exceeded') toast('Storage is full — delete some records to keep saving.');
    else if(err&&err.code==='invalid_argument') toast('Couldn\'t save — you may have view-only access.');
    else toast('Couldn\'t save that change. Check your connection.');
  });
  _writeChain[path]=next; return next;
}
let _lsT=null;
function persistLocal(){ clearTimeout(_lsT); _lsT=setTimeout(()=>lsSet(LS_DB,JSON.stringify(DB)),150); }

function saveRec(kind,rec){
  rec.updated=new Date().toISOString();
  const arr=DB[kind], i=arr.findIndex(x=>x.id===rec.id);
  if(i>=0) arr[i]=rec; else arr.push(rec);
  if(MODE==='cloud'){ const body=clone(rec); return queueWrite(kind+'/'+rec.id,()=>CLOUD.collection(kind).doc(rec.id).set(body)); }
  persistLocal(); return Promise.resolve();
}
function delRec(kind,id){
  DB[kind]=DB[kind].filter(x=>x.id!==id);
  if(MODE==='cloud') return queueWrite(kind+'/'+id,()=>CLOUD.collection(kind).doc(id).delete());
  persistLocal(); return Promise.resolve();
}
let _setT=null;
function saveSettingsDoc(){
  if(MODE==='cloud'){ clearTimeout(_setT); _setT=setTimeout(()=>{ const body=clone(S()); queueWrite('config/settings',()=>CLOUD.doc('config/settings').set(body)); },300); }
  else persistLocal();
}
let _actT=null;
function logActivity(text,link){
  DB.activity.unshift({ts:new Date().toISOString(),who:ME()||'',text,link:link||null});
  if(DB.activity.length>300) DB.activity.length=300;
  if(MODE==='cloud'){ clearTimeout(_actT); _actT=setTimeout(()=>{ const body={items:clone(DB.activity)}; queueWrite('config/activity',()=>CLOUD.doc('config/activity').set(body)); },800); }
  else persistLocal();
}

function setSync(state,text){ const d=$('sync-dot'); if(d) d.className='dot '+(state==='ok'?'ok':'off'); const t=$('sync-text'); if(t) t.textContent=text; }

async function boot(){
  applyTheme();
  const hasRuntime = typeof window.claude==='object' && window.claude && typeof window.claude.use==='function';
  if(hasRuntime){
    let db=null;
    try{ db=await Promise.race([window.claude.use('db'), new Promise(r=>setTimeout(()=>r(null),10000))]); }catch(e){ db=null; }
    if(db){ CLOUD=db; MODE='cloud'; startCloud(); return; }
  }
  startLocal(hasRuntime);
}
function startLocal(wasArtifact){
  MODE='local';
  const raw=lsGet(LS_DB);
  if(raw){ try{ const o=JSON.parse(raw); KINDS.forEach(k=>{ if(Array.isArray(o[k])) DB[k]=o[k]; }); if(Array.isArray(o.activity)) DB.activity=o.activity; if(o.settings) DB.settings=o.settings; }catch(e){} }
  ensureSettings();
  setSync('off', wasArtifact?'Saved in this browser only':'Saved on this device');
  ready();
}
function startCloud(){
  setSync('off','Connecting…');
  let first=true;
  const timer=setTimeout(()=>{ if(first){ first=false; if(!DB.settings) DB.settings=defaultSettings(); ensureSettings(); setSync('off','Can\'t reach storage yet — may be out of date'); ready(); } },10000);
  const mark=(k)=>{ _cloudReady[k]=true; if(first && KINDS.every(x=>_cloudReady[x]) && _cloudReady.settings){ first=false; clearTimeout(timer); ensureSettings(); setSync('ok','Synced · shared storage'); ready(); } else if(!first) scheduleRender(); };
  const onErr=(e)=>{ console.error('Sync error',e); setSync('off', e&&e.code==='revoked'?'Access changed — read only':'Sync interrupted'); };
  KINDS.forEach(k=>{
    CLOUD.collection(k).onSnapshot(snap=>{
      DB[k]=snap.docs.map(d=>Object.assign(clone(d.data()||{}),{id:d.id}));
      if(!snap.metadata.fromCache || !first) mark(k); else if(snap.size) mark(k);
    },onErr);
  });
  CLOUD.doc('config/settings').onSnapshot(snap=>{
    if(snap.exists) DB.settings=clone(snap.data()); else if(!DB.settings) DB.settings=defaultSettings();
    if(!snap.metadata.fromCache || !first || snap.exists) mark('settings');
    applyTheme(); refreshMeSelect();
  },onErr);
  CLOUD.doc('config/activity').onSnapshot(snap=>{
    if(snap.exists){ const d=snap.data(); DB.activity=Array.isArray(d.items)?clone(d.items):[]; }
    if(!first && route.view==='activity') scheduleRender();
  },()=>{});
}

/* Re-render on remote changes, but never yank a field the user is typing in. */
let _renderPending=false;
function scheduleRender(){
  const ae=document.activeElement;
  const typing = ae && $('content').contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && ae.id!=='list-q';
  if(typing){ if(!_renderPending){ _renderPending=true; ae.addEventListener('blur',()=>{ _renderPending=false; render(); },{once:true}); } return; }
  clearTimeout(window._srT); window._srT=setTimeout(()=>{ render(); refreshBadges(); },60);
}

let _booted=false;
function ready(){
  _booted=true;
  refreshMeSelect();
  applyTheme();
  const r=parseHash();
  go(r.view,r.id,r.tab,true);
  refreshBadges();
}

/* ---------- THEME ---------- */
function applyTheme(){
  const t=(DB.settings&&DB.settings.theme)||lsGet('homedesk_theme')||'light';
  document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');
}
function toggleTheme(){
  const cur=(DB.settings&&DB.settings.theme)||lsGet('homedesk_theme')||'light';
  const nt=cur==='dark'?'light':'dark';
  lsSet('homedesk_theme',nt);
  if(DB.settings){ DB.settings.theme=nt; saveSettingsDoc(); }
  applyTheme();
}

/* ---------- ROUTER ----------
   Hash format: #view or #view--id (artifact hosts only pass plain #names). */
const NAV_TITLES={dashboard:'Dashboard',commissions:'Commissions',contacts:'Contacts',pipeline:'Pipeline',outreach:'Follow-ups',
  listings:'Listings',showings:'Showings',transactions:'Transactions',calendar:'Calendar',tasks:'Tasks',activity:'Activity',prefs:'Settings',deal:'Deal'};
const NAV_OF={deal:'pipeline'};
let route={view:'dashboard',id:null,tab:null};
const VIEWS={};
function parseHash(){
  let h=''; try{ h=(location.hash||'').replace(/^#/,''); }catch(e){}
  const [v,id]=h.split('--');
  return {view:VIEWS[v]?v:'dashboard',id:id||null,tab:null};
}
let _hashSelf=false;
window.addEventListener('hashchange',()=>{ if(_hashSelf){ _hashSelf=false; return; } if(!_booted) return; const r=parseHash(); go(r.view,r.id,null,true); });
function toggleNav(){ document.body.classList.toggle('nav-open'); }
function closeNav(){ document.body.classList.remove('nav-open'); }
function go(view,id=null,tab=null,fromHash=false){
  closeNav(); closeSearch();
  if(!VIEWS[view]) view='dashboard';
  const sameRec = route.view===view && route.id===id;
  route={view,id,tab:tab||(sameRec?route.tab:null)};
  const navv=NAV_OF[view]||view;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===navv));
  $('page-title').textContent=NAV_TITLES[view]||'HomeDesk';
  if(!fromHash){ const h=view+(id?'--'+id:''); try{ if(location.hash.replace(/^#/,'')!==h){ _hashSelf=true; location.hash=h; } }catch(e){} }
  render();
  if(!sameRec) $('content').scrollTop=0;
}
function setTab(t){ route.tab=t; render(); }
function render(){
  if(!_booted) return;
  const c=$('content'), a=$('page-actions');
  a.innerHTML='';
  const R=VIEWS[route.view];
  try{ R.render(c,a); }
  catch(err){
    console.error('Render error',route.view,err);
    c.innerHTML=`<div style="padding:32px;max-width:560px"><div style="font-size:15px;font-weight:600;margin-bottom:8px">Something went wrong rendering this page.</div>
      <pre style="font-size:11px;color:var(--txt3);white-space:pre-wrap;margin-bottom:16px">${esc(err.message)}</pre>
      <button class="btn sm" onclick="go('dashboard')">← Back to dashboard</button></div>`;
  }
}
document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>go(n.dataset.view)));

/* ---------- MODAL ---------- */
function openModal(title,bodyHTML,footHTML,opts){
  opts=opts||{};
  const root=$('modal-root');
  root.innerHTML=`<div class="overlay" id="ov"><div class="modal" style="${opts.width?'width:'+opts.width+'px':''}">
    <div class="modal-head"><div class="modal-title">${esc(title)}</div><div class="modal-x" onclick="closeModal()">×</div></div>
    <div class="modal-body">${bodyHTML}</div>
    <div class="modal-foot">${footHTML||''}</div></div></div>`;
  $('ov').addEventListener('mousedown',e=>{ if(e.target.id==='ov') closeModal(); });
  setTimeout(()=>{ const f=root.querySelector('.modal-body input:not([type=checkbox]):not([type=hidden]),.modal-body textarea'); if(f&&!opts.noFocus&&window.innerWidth>760) f.focus(); },30);
}
function closeModal(){ $('modal-root').innerHTML=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('modal-root').innerHTML) closeModal(); closeSearch(); } });
let _confirmCb=null;
function confirmModal(msg,cb,yes,danger){
  _confirmCb=cb;
  openModal('Please confirm','<p style="font-size:14px;line-height:1.6">'+msg+'</p>',
    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn '+(danger===false?'primary':'danger')+'" onclick="const f=_confirmCb;closeModal();f&&f()">'+esc(yes||'Delete')+'</button>',{noFocus:true});
}

/* ---------- DOWNLOADS ---------- */
async function downloadFile(filename,text,mime){
  if(MODE==='cloud' && window.claude && window.claude.use){
    try{
      const dl=await window.claude.use('downloads');
      if(dl){ await dl.save({filename,data:text}); toast('Saved '+filename); return; }
    }catch(e){ if(e&&e.code==='declined') return; console.warn('download capability',e); }
  }
  try{
    const blob=new Blob([text],{type:mime||'text/plain'}); const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }catch(e){ copyText(text,'File contents copied'); }
}

function globalSearch(q){
  const box=$('search-results'); q=(q||'').trim().toLowerCase();
  if(!q||!_booted){ box.style.display='none'; _srItems=[]; return; }
  const hit=s=>String(s||'').toLowerCase().includes(q);
  const groups=[];

/* ----- deals & commission ----- */
function dealPrice(d){ return +d.salePrice||+d.offerPrice||+d.price||0; }
function dealComm(d){
  const s=S();
  const price=dealPrice(d);
  const pct=d.commPct!=null&&d.commPct!==''?+d.commPct:+s.commPct;
  const split=d.splitPct!=null&&d.splitPct!==''?+d.splitPct:+s.splitPct;
  const fees=d.fees!=null&&d.fees!==''?+d.fees:+s.txnFee;
  const gross=price*pct/100;
  const agent=Math.max(0,gross*split/100-fees);
  const prob=d.stage==='Closed'?100:(d.prob!=null&&d.prob!==''?+d.prob:STAGE_PROB[d.stage]||0);
  return {price,pct,split,fees,gross,agent,brokerage:gross-gross*split/100,prob,weighted:agent*prob/100};
}
function dealCloseDate(d){ return (d.dates&&d.dates.closing)||d.expectedClose||''; }

/* ----- follow-ups ----- */
function cadenceFor(c){ const cad=S().cadence||{}; if(c.type==='Past client') return cad['Past client']||90; if(c.type==='Sphere') return cad['Sphere']||60; return cad[c.temp]||14; }
function lastTouch(c){ const t=(c.touches||[]).map(x=>x.date).sort(); return t[t.length-1]||''; }
function followUpsDue(){
  const t0=todayStr(); const me=ME(); const multi=teamList().length>1;
  return DB.contacts.filter(c=>c.nextFollowUp && c.nextFollowUp<=t0 && !['Dead'].includes(c.stage) && c.type!=='Vendor' && (!multi||!c.agent||c.agent===me))
    .sort((a,b)=>a.nextFollowUp.localeCompare(b.nextFollowUp));
}
function staleContacts(){
  // Past clients & sphere with no touch inside their cadence and no follow-up scheduled
  const t0=todayStr();
  return DB.contacts.filter(c=>['Past client','Sphere'].includes(c.type) && (!c.nextFollowUp||c.nextFollowUp>addDays(t0,30)) && c.stage!=='Dead')
    .map(c=>({c,last:lastTouch(c)||c.created&&c.created.slice(0,10)||''}))
    .filter(x=>!x.last||daysBetween(x.last,t0)>=cadenceFor(x.c))
    .sort((a,b)=>(a.last||'').localeCompare(b.last||'')).map(x=>x.c);
}
function nextOccurrence(mmdd){ // from YYYY-MM-DD, next anniversary date on/after today
  if(!mmdd) return ''; const t=parseD(todayStr()); const d=parseD(mmdd); if(isNaN(d)) return '';
  let n=new Date(t.getFullYear(),d.getMonth(),d.getDate(),12); if(n<t) n=new Date(t.getFullYear()+1,d.getMonth(),d.getDate(),12);
  return ymd(n);
}
function lifeEvents(days){
  const out=[]; const lim=addDays(todayStr(),days);
  DB.contacts.forEach(c=>{
    if(c.birthday){ const n=nextOccurrence(c.birthday); if(n&&n<=lim) out.push({c,date:n,kind:'Birthday',ico:'🎂'}); }
    if(c.homeAnniversary){ const n=nextOccurrence(c.homeAnniversary); if(n&&n<=lim){ const yrs=parseD(n).getFullYear()-parseD(c.homeAnniversary).getFullYear(); if(yrs>0) out.push({c,date:n,kind:yrs+(yrs===1?' year':' years')+' in their home',ico:'⌂'}); } }
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function logTouch(contactId,type,note,date,opts){
  opts=opts||{};
  const c=get('contacts',contactId); if(!c) return;
  c.touches=c.touches||[];
  const d=date||todayStr();
  c.touches.push({id:uid('to'),date:d,type,note:note||'',by:ME()});
  if(opts.nextFollowUp!==undefined) c.nextFollowUp=opts.nextFollowUp;
  else if(!c.nextFollowUp||c.nextFollowUp<=addDays(todayStr(),0)) c.nextFollowUp=addDays(d,cadenceFor(c));
  if(c.stage==='New lead' && ['Call','Email','Text','Meeting'].includes(type)) c.stage='Contacted';
  saveRec('contacts',c);
  logActivity('logged a '+type.toLowerCase()+' with '+fullName(c),{view:'contacts',id:c.id});
}

/* ----- buyer ↔ listing matching ----- */
function matchScore(l,c){
  const cr=c.criteria||{}; if(!cr) return 0;
  const price=+l.price||0; let score=0, checks=0;
  if(cr.maxPrice){ checks++; if(price<=+cr.maxPrice*1.03) score++; else return 0; }
  if(cr.minPrice){ checks++; if(price>=+cr.minPrice*0.97) score++; else return 0; }
  if(cr.beds){ checks++; if((+l.beds||0)>=+cr.beds) score++; else return 0; }
  if(cr.baths){ checks++; if((+l.baths||0)>=+cr.baths) score++; else return 0; }
  if(cr.types&&cr.types.length){ checks++; if(cr.types.includes(l.type)) score++; else return 0; }
  if(cr.areas){ checks++; const hay=((l.address||'')+' '+(l.city||'')+' '+(l.neighbourhood||'')).toLowerCase(); const ok=cr.areas.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean).some(a=>hay.includes(a)); if(ok) score++; else return 0; }
  return checks?score:0;
}
function hasCriteria(c){ const cr=c.criteria||{}; return !!(cr.maxPrice||cr.minPrice||cr.beds||cr.baths||(cr.types&&cr.types.length)||cr.areas); }
function buyersFor(l){ return DB.contacts.filter(c=>['Buyer','Buyer & Seller','Investor'].includes(c.type) && !['Dead','Closed'].includes(c.stage) && hasCriteria(c) && matchScore(l,c)>0); }
function listingsFor(c){ if(!hasCriteria(c)) return []; return DB.listings.filter(l=>['Active','Coming soon'].includes(l.status) && matchScore(l,c)>0); }

/* ----- calendar feed ----- */
function calendarItems(from,to){
  const out=[]; const inR=d=>d&&d>=from&&d<=to;
  DB.showings.forEach(s=>{ if(inR(s.date)&&s.status!=='Cancelled'){ const l=get('listings',s.listingId); const c=get('contacts',s.contactId); out.push({date:s.date,time:s.time,kind:'showing',label:'Showing · '+(l?l.address:(s.address||'')),sub:c?fullName(c):'',go:`showingForm('${s.id}')`}); } });
  DB.listings.forEach(l=>{
    (l.openHouses||[]).forEach(o=>{ if(inR(o.date)) out.push({date:o.date,time:o.start,kind:'open',label:'Open house · '+l.address,sub:(o.start?fmtTime(o.start)+'–'+fmtTime(o.end):''),go:`go('listings','${l.id}','open')`}); });
    if(['Active','Coming soon'].includes(l.status)&&inR(l.expiryDate)) out.push({date:l.expiryDate,kind:'expiry',label:'Listing expires · '+l.address,go:`go('listings','${l.id}')`});
  });
  DB.deals.forEach(d=>{
    if(d.stage==='Lost') return;
    KEY_DATES.forEach(([k,lbl])=>{ const v=d.dates&&d.dates[k]; if(inR(v)&&!['offer','acceptance'].includes(k)) out.push({date:v,kind:k==='closing'?'close':'date',label:lbl+' · '+d.name,go:`go('deal','${d.id}')`}); });
  });
  DB.tasks.forEach(t=>{ if(!t.done&&inR(t.due)) out.push({date:t.due,time:t.time,kind:'task',label:'☐ '+t.title,go:`taskForm('${t.id}')`}); });
  const span=daysBetween(todayStr(),to)+1;
  if(span>0) lifeEvents(Math.min(400,span)).forEach(e=>{ if(inR(e.date)) out.push({date:e.date,kind:'life',label:e.ico+' '+fullName(e.c)+' — '+e.kind,go:`go('contacts','${e.c.id}')`}); });
  return out.sort((a,b)=>(a.date+(a.time||'99')).localeCompare(b.date+(b.time||'99')));
}

function autoDealName(d,c,l){

/* Stage changes go through here so Closed / Lost / Conditional get their side effects. */
function changeStage(id,stage,prevStage){
  const d=get('deals',id); if(!d) return;
  prevStage=prevStage||d.stage;
  if(stage==='Closed'){ closeDealModal(id,prevStage); return; }
  if(stage==='Lost'){ lostDealModal(id,prevStage); return; }
  d.stage=stage;
  if(stage==='Conditional'||stage==='Firm'){ d.dates=d.dates||{}; if(!d.dates.acceptance) d.dates.acceptance=todayStr(); recomputeChecklistDue(d.checklist,d.dates); ensureDealChecklist(d); }
  saveRec('deals',d);
  syncContactStageFromDeal(d);
  syncListingFromDeal(d);
  logActivity('moved '+d.name+' to '+stage,{view:'deal',id:d.id});
  render();

function syncContactStageFromDeal(d){
  const c=get('contacts',d.contactId); if(!c) return;
  const map={Active:'Active',Offer:'Active',Conditional:'Under contract',Firm:'Under contract'};
  const ns=map[d.stage]; if(ns && c.stage!==ns && c.stage!=='Closed'){ c.stage=ns; if(['Conditional','Firm','Offer'].includes(d.stage)) c.temp='Hot'; saveRec('contacts',c); }

function syncListingFromDeal(d){

function resizeImage(file,max){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const r=Math.min(1,max/Math.max(img.width,img.height)); const cv=document.createElement('canvas'); cv.width=Math.round(img.width*r); cv.height=Math.round(img.height*r); cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); res(cv.toDataURL('image/jpeg',0.72)); }; img.onerror=rej; img.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="checklistSave('${kind}','${id}')">Add</button>`);

function checklistSave(kind,id){

  rec.checklist=rec.checklist||[]; rec.checklist.push({id:uid('ck'),title:fv('ci-title'),due:fv('ci-due'),manualDue:true,done:false});
  saveRec(kind,rec); closeModal(); render();

function checklistDel(kind,id,itemId){ const rec=get(kind,id); if(!rec) return; rec.checklist=(rec.checklist||[]).filter(i=>i.id!==itemId); saveRec(kind,rec); render(); }
function checklistApply(kind,id,tpl){
  const rec=get(kind,id); if(!rec) return;

  const have=new Set((rec.checklist||[]).map(i=>i.title));
  rec.checklist=(rec.checklist||[]).concat(buildChecklist(tpl,anchors).filter(i=>!have.has(i.title)));

function checklistHTML(kind,rec){
  const t0=todayStr();
  const list=(rec.checklist||[]).slice().sort((a,b)=>(a.done-b.done)||((a.due||'9')<(b.due||'9')?-1:1));
  const done=list.filter(i=>i.done).length;
  const src=kind==='deals'?'deal':'listing';
  return (list.length?`<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><div class="progress" style="flex:1"><div style="width:${Math.round(done/list.length*100)}%"></div></div><span style="font-size:12px;color:var(--txt2)">${done}/${list.length}</span></div>`:'')
    +list.map(i=>{ const od=!i.done&&i.due&&i.due<t0; return `<div class="chk-row"><input type="checkbox" ${i.done?'checked':''} onchange="toggleChecklist('${src}','${rec.id}','${i.id}')">

      <span style="font-size:11px;color:${od?'var(--red)':'var(--txt3)'};font-weight:${od?600:400}">${i.due?(od?'Overdue · ':'')+fmtDateShort(i.due):(i.anchor?'set '+(i.anchor==='listDate'?'list date':i.anchor+' date'):'')}</span>
      <a class="tl-del" onclick="checklistDel('${kind}','${rec.id}','${i.id}')" title="Remove">×</a></div>`; }).join('')
    +(list.length?'':'<p class="muted" style="font-size:13px;margin-bottom:10px">No checklist yet.</p>')
    +`<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn sm" onclick="checklistAdd('${kind}','${rec.id}')">+ Add item</button>

        <div class="info"><label>Lead source</label><span>${esc(x.source||'—')}</span></div>
        <div class="info"><label>Next follow-up</label><span style="${x.nextFollowUp&&x.nextFollowUp<=todayStr()?'color:var(--red);font-weight:600':''}">${x.nextFollowUp?fmtDate(x.nextFollowUp)+' ('+relDay(x.nextFollowUp)+')':'—'}</span></div>

        <div class="info"><label>Price</label><span>${cr.minPrice||cr.maxPrice?(cr.minPrice?moneyK(cr.minPrice):'Up to')+' '+(cr.minPrice&&cr.maxPrice?'– ':'')+(cr.maxPrice?moneyK(cr.maxPrice):'+'):'—'}</span></div>
        <div class="info"><label>Beds / baths</label><span>${cr.beds?cr.beds+'+ bd':'—'} · ${cr.baths?cr.baths+'+ ba':'—'}</span></div>
        <div class="info"><label>Areas</label><span>${esc(cr.areas||'—')}</span></div>

      </div>${cr.mustHaves?`<p style="font-size:13px;margin-top:12px"><span class="muted">Must-haves:</span> ${esc(cr.mustHaves)}</p>`:''}</div>`:''}
      ${listings.length?`<div class="sec"><div class="sec-label">Their listings</div>${listings.map(l=>`<div class="lrow" onclick="go('listings','${l.id}')"><div class="lrow-main"><div class="lrow-title">${esc(l.address)}</div><div class="lrow-sub">${money(l.price)} · ${esc(specs(l))}</div></div>${badge(l.status,lStatusColor(l.status))}</div>`).join('')}</div>`:''}
      <div class="sec"><div class="sec-label">Personal</div><div class="info-grid">

  } else if(tab==='showings'){
    body=(shows.length?shows.map(showingRow).join(''):emptyState('⚲','No showings yet.'))+`<div style="margin-top:10px"><button class="btn sm" onclick="showingForm(null,{contactId:'${x.id}'})">+ Schedule showing</button></div>`;

      :emptyState('⌂','Add what they\'re looking for (price, beds, areas) and matching listings will show up here.','<button class="btn sm" onclick="contactForm(\''+x.id+'\')">Add criteria</button>');

    </div>
    <div class="tabs">${tabs.map(([k,l])=>`<div class="tab ${tab===k?'active':''}" onclick="setTab('${k}')">${l}</div>`).join('')}</div>

function pFilter(){ return window._pf||(window._pf={kind:'',agent:'',showClosed:false,mode:'board'}); }
VIEWS.pipeline={
  render(c,a){
    a.innerHTML='<button class="btn sm primary" onclick="dealForm()">+ New deal</button>';
    const f=pFilter(); const team=teamList();
    const deals=DB.deals.filter(d=>(!f.kind||d.kind===f.kind)&&(!f.agent||d.agent===f.agent));
    const stages=f.showClosed?DEAL_STAGES:DEAL_OPEN;
    const open=deals.filter(d=>DEAL_OPEN.includes(d.stage));
    const tot=open.reduce((n,d)=>n+dealComm(d).agent,0), w=open.reduce((n,d)=>n+dealComm(d).weighted,0);
    const yr=todayStr().slice(0,4);
    const recentDone=d=>(d.closedAt||d.updated||'').slice(0,4)===yr;
    c.innerHTML=`<div class="filters">
      <div class="seg">${[['','All'],['Buy','Buyers'],['Sell','Sellers']].map(([k,l])=>`<button class="${f.kind===k?'on':''}" onclick="window._pf.kind='${k}';render()">${l}</button>`).join('')}</div>
      <div class="seg">${[['board','Board'],['list','List']].map(([k,l])=>`<button class="${f.mode===k?'on':''}" onclick="window._pf.mode='${k}';render()">${l}</button>`).join('')}</div>
      ${team.length>1?`<select onchange="window._pf.agent=this.value;render()">${opts(team,f.agent,'All agents')}</select>`:''}
      <label class="bk-check"><input type="checkbox" ${f.showClosed?'checked':''} onchange="window._pf.showClosed=this.checked;render()"> Show closed & lost (${yr})</label>
      <span style="margin-left:auto;font-size:12px;color:var(--txt2)">${open.length} open · <b>${moneyK(tot)}</b> potential · <b>${moneyK(w)}</b> weighted</span>
    </div>
    ${f.mode==='list'?pipelineList(deals.filter(d=>stages.includes(d.stage)&&(DEAL_OPEN.includes(d.stage)||recentDone(d)))):`<div class="kanban">${stages.map(st=>{
      const col=deals.filter(d=>d.stage===st&&(DEAL_OPEN.includes(st)||recentDone(d))).sort((x,y)=>(dealCloseDate(x)||'9').localeCompare(dealCloseDate(y)||'9'));
      const sum=col.reduce((n,d)=>n+dealComm(d).agent,0);
      return `<div class="kcol" data-stage="${st}" ondragover="event.preventDefault();this.classList.add('drop')" ondragleave="this.classList.remove('drop')" ondrop="this.classList.remove('drop');dropDeal(event,'${st}')">
        <div class="khead"><div class="khead-top"><span>${st}</span><span>${col.length}</span></div><div class="khead-sub">${moneyK(sum)} GCI${DEAL_OPEN.includes(st)?' · '+STAGE_PROB[st]+'%':''}</div></div>
        <div class="kbody">${col.map(dealCard).join('')||'<div style="font-size:11px;color:var(--txt3);text-align:center;padding:10px 0">Drop deals here</div>'}</div></div>`; }).join('')}</div>`}`;
  }
};
function dealCard(d){
  const cm=dealComm(d); const cl=dealCloseDate(d); const ct=get('contacts',d.contactId);
  return `<div class="kcard" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${d.id}');this.classList.add('dragging')" ondragend="this.classList.remove('dragging')" onclick="go('deal','${d.id}')">
    <div class="kcard-title"><span class="kind-dot ${d.kind}"></span>${esc(ct?fullName(ct):d.name)}</div>
    <div class="kcard-sub">${esc(d.address||(d.kind==='Sell'?'Listing':'Buying')+(ct&&ct.criteria&&ct.criteria.areas?' · '+ct.criteria.areas:''))}</div>
    <div class="kcard-foot"><span class="kcard-amt">${cm.price?moneyK(cm.price):'—'}</span><span class="muted">${cl?'⏱ '+fmtDateShort(cl):''}</span></div>
    <div style="font-size:11px;color:var(--green);margin-top:3px">${cm.agent?moneyK(cm.agent)+' GCI':''}</div>
    <select class="kstage" onclick="event.stopPropagation()" onchange="changeStage('${d.id}',this.value)" style="display:none">${opts(DEAL_STAGES,d.stage)}</select>
  </div>`;
}
function dropDeal(e,stage){ e.preventDefault(); const id=e.dataTransfer.getData('text/plain'); const d=get('deals',id); if(d&&d.stage!==stage) changeStage(id,stage); }
function pipelineList(deals){
  if(!deals.length) return emptyState('⇶','No deals yet.','<button class="btn primary sm" onclick="dealForm()">+ New deal</button>');
  deals.sort((x,y)=>DEAL_STAGES.indexOf(y.stage)-DEAL_STAGES.indexOf(x.stage));
  return `<table class="tbl tbl-cards"><thead><tr><th>Deal</th><th>Side</th><th>Stage</th><th class="num">Price</th><th class="num">GCI</th><th class="num">Weighted</th><th>Close</th></tr></thead><tbody>
    ${deals.map(d=>{ const cm=dealComm(d); return `<tr onclick="go('deal','${d.id}')"><td><b>${esc(d.name)}</b></td><td>${d.kind==='Sell'?'Seller':'Buyer'}</td><td onclick="event.stopPropagation()"><select onchange="changeStage('${d.id}',this.value)" style="padding:3px 6px;border:1px solid var(--bord2);border-radius:6px;background:var(--surf);color:var(--txt);font-size:12px">${opts(DEAL_STAGES,d.stage)}</select></td>
      <td class="num">${cm.price?money(cm.price):'—'}</td><td class="num">${money(cm.agent)}</td><td class="num muted">${money(cm.weighted)}</td><td>${dealCloseDate(d)?fmtDateShort(dealCloseDate(d)):'—'}</td></tr>`; }).join('')}
  </tbody></table>
  <div class="ev-cards">${deals.map(d=>{ const cm=dealComm(d); return `<div class="ev-card" onclick="go('deal','${d.id}')"><div class="ev-card-top"><div><div class="ev-card-name"><span class="kind-dot ${d.kind}"></span>${esc(d.name)}</div><div class="ev-card-sub">${cm.price?money(cm.price):''}${dealCloseDate(d)?' · closes '+fmtDateShort(dealCloseDate(d)):''}</div></div><div class="ev-card-badges">${badge(d.stage,dStageColor(d.stage))}</div></div></div>`; }).join('')}</div>`;
}

VIEWS.transactions={
  render(c,a){
    a.innerHTML='<button class="btn sm primary" onclick="dealForm(null,{stage:\'Conditional\'})">+ New transaction</button>';
    const t0=todayStr();
    const live=DB.deals.filter(d=>['Offer','Conditional','Firm'].includes(d.stage)).sort((x,y)=>(dealCloseDate(x)||'9').localeCompare(dealCloseDate(y)||'9'));
    const recent=DB.deals.filter(d=>d.stage==='Closed'&&d.closedAt&&daysBetween(d.closedAt,t0)<=60).sort((x,y)=>y.closedAt.localeCompare(x.closedAt));
    const card=d=>{
      const cm=dealComm(d); const dt=d.dates||{}; const ck=d.checklist||[]; const done=ck.filter(i=>i.done).length;
      const next=KEY_DATES.filter(([k])=>!['offer','acceptance'].includes(k)&&dt[k]&&dt[k]>=t0).sort((p,q)=>dt[p[0]].localeCompare(dt[q[0]]))[0];
      const overdue=ck.filter(i=>!i.done&&i.due&&i.due<t0).length;
      return `<div class="card" onclick="go('deal','${d.id}')">
        <div class="card-top"><div class="card-title"><span class="kind-dot ${d.kind}"></span>${esc(d.name)}</div>${badge(d.stage,dStageColor(d.stage))}</div>
        <div class="card-sub">${esc(d.address||'')}</div>
        ${ck.length?`<div style="display:flex;align-items:center;gap:8px;margin-top:10px"><div class="progress sm" style="flex:1"><div style="width:${Math.round(done/ck.length*100)}%"></div></div><span style="font-size:11px;color:var(--txt3)">${done}/${ck.length}</span></div>`:''}
        ${overdue?`<div style="font-size:12px;color:var(--red);margin-top:6px">${overdue} overdue checklist item${overdue>1?'s':''}</div>`:''}
        <div class="card-meta"><div class="meta"><label>Next</label><span>${next?esc(next[1])+' · '+relDay(dt[next[0]]):'—'}</span></div>
          <div class="meta"><label>Closing</label><span>${dt.closing?fmtDateShort(dt.closing):'—'}</span></div>
          <div class="meta"><label>Price</label><span>${cm.price?money(cm.price):'—'}</span></div>
          <div class="meta"><label>Your GCI</label><span class="pos">${money(cm.agent)}</span></div></div></div>`;
    };
    c.innerHTML=`<div class="sec-head"><span class="sec-title">Under contract & in negotiation (${live.length})</span></div>
      ${live.length?'<div class="cards-grid">'+live.map(card).join('')+'</div>':emptyState('✎','No deals in Offer, Conditional or Firm right now. Move a deal to one of those stages and it\'ll show up here with its key dates and checklist.')}
      ${recent.length?`<div class="sec-head" style="margin-top:26px"><span class="sec-title">Closed in the last 60 days</span></div><div class="cards-grid">${recent.map(card).join('')}</div>`:''}`;
  }
};

function setListingStatus(id,s){
  const l=get('listings',id); if(!l||l.status===s) return;
  const prev=l.status; l.status=s; if(s==='Sold'&&!l.soldDate) l.soldDate=todayStr();

  if(s==='Sold'&&!l.soldPrice) listingForm(id);
}
function listingBlurb(id){
  const l=get('listings',id); const s=S();

}
function sellerReport(id){
  const l=get('listings',id); const s=S(); const seller=get('contacts',l.sellerId);
  const shows=DB.showings.filter(x=>x.listingId===l.id&&x.status!=='Cancelled');
  const ohs=l.openHouses||[]; const visitors=ohs.reduce((n,o)=>n+(o.visitors||[]).length,0);

}

function calNav(n){ const m=window._calM||{y:new Date().getFullYear(),m:new Date().getMonth()}; let mm=m.m+n,yy=m.y; if(mm<0){mm=11;yy--;} if(mm>11){mm=0;yy++;} window._calM={y:yy,m:mm}; render(); }
function calDay(ds){

  openModal(fmtDow(ds),(its.length?its.map(i=>`<div class="lrow" onclick="closeModal();${i.go}"><span class="when">${i.time?fmtTime(i.time):''}</span><div class="lrow-main"><div class="lrow-title">${esc(i.label)}</div>${i.sub?'<div class="lrow-sub">'+esc(i.sub)+'</div>':''}</div></div>`).join(''):'<p class="muted" style="font-size:13px">Nothing scheduled.</p>'),
    `<button class="btn" onclick="closeModal();taskForm(null,{due:'${ds}'})">+ Task</button><button class="btn" onclick="closeModal();showingForm(null,{date:'${ds}'})">+ Showing</button><button class="btn primary" onclick="closeModal()">Done</button>`,{noFocus:true});
}

VIEWS.tasks={
  render(c,a){
    a.innerHTML='<button class="btn sm primary" onclick="taskForm()">+ New task</button>';
    const tab=route.tab||'mine'; const me=ME(); const team=teamList(); const t0=todayStr();
    const sortT=(x,y)=>(x.due||'9999').localeCompare(y.due||'9999');
    let list=[];

function exportDealsCSV(y){
  const rows=[['Deal','Client','Side','Stage','Property','Price','Commission %','Split %','Fees','Gross commission','Agent GCI','Closed / expected','Lead source']];
  DB.deals.filter(d=>(d.closedAt||dealCloseDate(d)||'').startsWith(String(y))||DEAL_OPEN.includes(d.stage)).forEach(d=>{ const cm=dealComm(d); const ct=get('contacts',d.contactId);
    rows.push([d.name,ct?fullName(ct):'',d.kind,d.stage,d.address||'',cm.price,cm.pct,cm.split,cm.fees,cm.gross.toFixed(2),cm.agent.toFixed(2),d.closedAt||dealCloseDate(d)||'',ct?ct.source||'':'']); });
  downloadFile('homedesk-deals-'+y+'.csv',toCSV(rows),'text/csv');
}

const PLACEHOLDERS=['{first_name}','{last_name}','{full_name}','{agent_name}','{brokerage}','{agent_phone}','{agent_email}','{listing_address}','{listing_price}','{listing_specs}'];
function fillTpl(str,c,l){
  const s=S();
  const map={first_name:firstName(c),last_name:(c&&c.last)||'',full_name:fullName(c),agent_name:s.agentName||ME()||'',brokerage:s.brokerage||'',agent_phone:s.phone||'',agent_email:s.email||'',
    listing_address:l?l.address+(l.city?', '+l.city:''):'',listing_price:l&&l.price?money(l.price):'',listing_specs:l?specs(l):''};
  return String(str||'').replace(/\{(\w+)\}/g,(m,k)=>map[k]!=null?map[k]:m);
}
function mailtoHref(to,subj,body){ return 'mailto:'+encodeURIComponent(to||'')+'?subject='+encodeURIComponent(subj||'')+'&body='+encodeURIComponent(body||''); }

/* Bulk: step through a queue of contacts, one personalised email each */
let _bulk=null;
function bulkEmail(ids,tplId,listingId){
  const list=(ids||[]).map(id=>get('contacts',id)).filter(c=>c&&c.email);
  if(!list.length){ toast('None of those contacts have an email address'); return; }
  _bulk={ids:list.map(c=>c.id),i:0,tplId:tplId||((S().emailTemplates||[])[0]||{}).id,listingId:listingId||'',sent:new Set()};
  openModal('Email '+list.length+' contacts','<div id="bulk-body"></div>','<div id="bulk-foot" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;width:100%"></div>',{width:680,noFocus:true});
  bulkRender();
}
function bulkRender(){
  const b=_bulk; const c=get('contacts',b.ids[b.i]); const t=(S().emailTemplates||[]).find(x=>x.id===b.tplId); const l=get('listings',b.listingId);
  const subj=t?fillTpl(t.subject,c,l):'', body=t?fillTpl(t.body,c,l):'';
  $('bulk-body').innerHTML=`<div class="row2"><div class="field"><label>Template</label><select onchange="_bulk.tplId=this.value;bulkRender()">${opts((S().emailTemplates||[]).map(t=>[t.id,t.name]),b.tplId)}</select></div>
      <div class="field"><label>Listing</label>${listingPicker('bk-l',b.listingId,'— None —').replace('<select','<select onchange="_bulk.listingId=this.value;bulkRender()"')}</div></div>
    <div class="bk-progress" style="margin-bottom:12px"><div style="width:${b.sent.size/b.ids.length*100}%"></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>${b.i+1} of ${b.ids.length}: ${esc(fullName(c))}</b><span class="muted" style="font-size:12px">${esc(c.email)}${b.sent.has(c.id)?' · <span class="pos">sent ✓</span>':''}</span></div>
    <div class="field"><label>Subject</label><input id="em-subj" value="${esc(subj)}"></div>
    <div class="field"><label>Message</label><textarea id="em-body" style="min-height:200px">${esc(body)}</textarea></div><input type="hidden" id="em-to" value="${esc(c.email)}">`;
  $('bulk-foot').innerHTML=`<button class="btn" ${b.i?'':'disabled'} onclick="_bulk.i--;bulkRender()" style="margin-right:auto">‹ Prev</button>
    <button class="btn" onclick="composeCopy()">Copy</button><a class="btn" target="_blank" href="#" onclick="this.href=mailtoHref(fv('em-to'),fv('em-subj'),fv('em-body'))">Open in mail</a>
    <button class="btn primary" onclick="bulkSent()">${b.sent.has(c.id)?'Next ›':'Mark sent & next ›'}</button>`;

/* ---------- CSV ---------- */
function toCSV(rows){ return rows.map(r=>r.map(v=>{ v=v==null?'':String(v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(',')).join('\r\n'); }
function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  text=text.replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','||ch==='\t'&&!text.includes(',')){ row.push(f); f=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=ch;
  }
  if(f||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()));
}

  const rows=[['First name','Last name','Email','Phone','Type','Stage','Temperature','Source','Company','Address','Birthday','Home anniversary','Next follow-up','Last touch','Tags','Notes']];

  downloadFile('homedesk-contacts-'+todayStr()+'.csv',toCSV(rows),'text/csv');
}

    <div class="field"><input type="file" id="imp-csv" accept=".csv,.tsv,.txt,text/csv" onchange="importContactsRead(this.files[0])"></div><div id="imp-preview"></div>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="imp-go" disabled onclick="importContactsGo()">Import</button>`,{noFocus:true});

function importContactsRead(file){
  if(!file) return; const fr=new FileReader();
  fr.onload=()=>{
    const rows=parseCSV(String(fr.result)); if(rows.length<2){ $('imp-preview').innerHTML='<p class="neg" style="font-size:13px">No rows found.</p>'; return; }
    const head=rows[0].map(h=>h.trim().toLowerCase());
    const find=(...keys)=>head.findIndex(h=>keys.some(k=>h===k||h.replace(/[^a-z]/g,'')===k.replace(/[^a-z]/g,'')));
    const findLoose=(...keys)=>{ let i=find(...keys); if(i<0) i=head.findIndex(h=>keys.some(k=>h.includes(k))); return i; };
    const col={first:findLoose('first name','firstname','given name'),last:findLoose('last name','lastname','surname','family name'),name:find('name','full name','contact','display name'),
      email:findLoose('email','e-mail'),phone:findLoose('phone','mobile','cell','telephone'),type:find('type','contact type','category'),source:findLoose('source','lead source'),
      company:findLoose('company','organization','organisation'),address:findLoose('address','street'),city:find('city','town'),tags:findLoose('tags','labels','groups'),notes:findLoose('notes','note','comments'),
      birthday:findLoose('birthday','date of birth','dob'),stage:find('stage','status'),temp:find('temperature','temp','rating')};
    const existing=new Set(DB.contacts.map(c=>(c.email||'').toLowerCase()).filter(Boolean));
    const g=(r,i)=>i>=0?(r[i]||'').trim():'';
    const recs=rows.slice(1).map(r=>{
      let first=g(r,col.first), last=g(r,col.last);
      if(!first&&!last&&col.name>=0){ const p=g(r,col.name).split(/\s+/); first=p.shift()||''; last=p.join(' '); }
      const type=CONTACT_TYPES.find(t=>t.toLowerCase()===g(r,col.type).toLowerCase())||'Sphere';
      const bd=g(r,col.birthday); const bdOk=/^\d{4}-\d{2}-\d{2}$/.test(bd)?bd:(()=>{ const d=new Date(bd); return bd&&!isNaN(d)?ymd(d):''; })();
      return {first,last,email:g(r,col.email),phone:g(r,col.phone),type,source:g(r,col.source)||'Imported',company:g(r,col.company),
        address:[g(r,col.address),g(r,col.city)].filter(Boolean).join(', '),tags:g(r,col.tags).split(/[;,]/).map(s=>s.trim()).filter(Boolean),notes:g(r,col.notes),birthday:bdOk,
        stage:CONTACT_STAGES.find(t=>t.toLowerCase()===g(r,col.stage).toLowerCase())||(type==='Past client'?'Closed':'Nurturing'),temp:TEMPS.find(t=>t.toLowerCase()===g(r,col.temp).toLowerCase())||'Cold'};
    }).filter(r=>r.first||r.last||r.email);
    const fresh=recs.filter(r=>!r.email||!existing.has(r.email.toLowerCase()));
    _imp=fresh;
    $('imp-preview').innerHTML=`<p style="font-size:13px;margin-bottom:8px"><b>${fresh.length}</b> contacts ready to import${recs.length-fresh.length?' · '+(recs.length-fresh.length)+' skipped (email already in HomeDesk)':''}.</p>
      <table class="tbl" style="font-size:12px"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Type</th></tr></thead><tbody>${fresh.slice(0,6).map(r=>`<tr style="cursor:default"><td>${esc((r.first+' '+r.last).trim())}</td><td>${esc(r.email)}</td><td>${esc(r.phone)}</td><td>${esc(r.type)}</td></tr>`).join('')}</tbody></table>
      ${fresh.length>6?'<p class="muted" style="font-size:11px;margin-top:4px">…and '+(fresh.length-6)+' more</p>':''}
      <div class="field" style="margin-top:12px"><label>Import as type</label><select id="imp-type">${opts([['','Use the Type column (default Sphere)']].concat(CONTACT_TYPES.map(t=>[t,t])),'')}</select></div>`;
    $('imp-go').disabled=!fresh.length;
  };
  fr.readAsText(file);

let _thr=0;
async function saveRecThrottled(kind,rec){ const p=saveRec(kind,rec); if(MODE==='cloud'&&(++_thr%8===0)) await p; }

/* ---------- BACKUP ---------- */
function exportBackup(){
  const data={app:'HomeDesk',version:1,exported:new Date().toISOString(),settings:S(),activity:DB.activity};
  KINDS.forEach(k=>data[k]=DB[k]);
  downloadFile('homedesk-backup-'+todayStr()+'.json',JSON.stringify(data,null,1),'application/json');
}
function importBackup(file){
  if(!file) return; const fr=new FileReader();
  fr.onload=()=>{
    let o; try{ o=JSON.parse(String(fr.result)); }catch(e){ toast('That file isn\'t a valid backup'); return; }
    if(!o||!KINDS.some(k=>Array.isArray(o[k]))){ toast('That file isn\'t a HomeDesk backup'); return; }
    const n=KINDS.reduce((s,k)=>s+((o[k]||[]).length),0);
    confirmModal(`Restore <b>${n}</b> records from this backup? Records with the same ID are overwritten; everything else stays.`,async()=>{
      if(o.settings){ DB.settings=Object.assign(defaultSettings(),o.settings); ensureSettings(); saveSettingsDoc(); }
      for(const k of KINDS) for(const r of (o[k]||[])) if(r&&r.id) await saveRecThrottled(k,r);
      logActivity('restored a backup ('+n+' records)'); applyTheme(); refreshMeSelect(); go('dashboard'); toast('Backup restored');
    },'Restore',false);
  };
  fr.readAsText(file);
}
function wipeAll(){
  confirmModal('Delete <b>every</b> contact, deal, listing, showing and task? This can\'t be undone — export a backup first if you might want it back.',async()=>{
    for(const k of KINDS){ for(const r of DB[k].slice()){ const p=delRec(k,r.id); if(MODE==='cloud'&&(++_thr%8===0)) await p; } }
    logActivity('deleted all data'); go('dashboard'); toast('All data deleted');
  },'Delete everything');
}
async function clearSampleData(){
  for(const k of KINDS){ for(const r of DB[k].filter(x=>x.sample)){ const p=delRec(k,r.id); if(MODE==='cloud'&&(++_thr%8===0)) await p; } }
  logActivity('removed the sample data'); render(); refreshBadges(); toast('Sample data removed');
}
